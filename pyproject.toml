# Starter quality config (Terminal v2 PLAN 0.8 / G12; R-ARCH §5 fix 9). CI: .github/workflows/ci.yml, python job,
# steps "ruff", "mypy (per package)", "pin drift", "pip-audit"; the gate tests: scripts/tests/test_tv2_g12_quality_gates.py.
# Lint tools are pinned in the workflow (ruff 0.16.4, mypy 2.3.1: the versions of the canonical jupyter_env); the
# requirements.txt pins (ruff 0.6.9, mypy 1.11.2) are stale — see the B6 result.

[tool.ruff]
required-version = ">=0.16"
line-length = 130
target-version = "py313"
# .gitignore'd paths (data/, ui/node_modules, caches, desktop/src-tauri/target, ...) are skipped by ruff's default
# respect-gitignore; nothing else is excluded wholesale, so a new file anywhere gets the full rule set.

[tool.ruff.lint]
select = ["F", "E9", "B", "ASYNC", "DTZ"]
# ASYNC109 ("async def with a timeout parameter"): a per-call timeout argument is the API of shared/http_client.get_json and
# the routers built on it (PLAN 1.5); the rule is a style preference for asyncio.timeout(), not a defect. Off repo-wide.
ignore = ["ASYNC109"]


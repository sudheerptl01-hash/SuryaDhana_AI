[tool.mypy]
# Per package (R-ARCH: data-service/main.py and ui-api/main.py are both "main", so one whole-repo run cannot work).
# CI runs three scopes, each from its service directory with MYPYPATH = the repo root:
#   mypy --config-file pyproject.toml shared
#   (cd services/data-service && mypy --config-file ../../pyproject.toml fo_iv index_drivers data_health)
#   (cd services/ui-api && mypy --config-file ../../pyproject.toml routers/derivatives.py routers/data_health.py routers/options_strategy.py)
# Scope chosen so the existing code passes: the Terminal v2 packages and routers are checked; the legacy modules are not
# yet (markets.py's drivers section 32 errors, storage/duckdb_store.py 14, master_controller.py 2, nse_positions.py 1 —
# B6 result, open issues).
python_version = "3.13"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# pre-existing errors in shared/ outside Terminal v2 (15 at the cut): decision_desk.py and trading_costs.py are frozen
# trading rules (CLAUDE.md "DO NOT CHANGE without review"); config.py's try/except re-import, logging.py's processor
# typing and icici_login.py's list.append-in-expression are their owners' to fix.
module = ["shared.config", "shared.decision_desk", "shared.icici_login", "shared.logging", "shared.trading_costs"]
ignore_errors = true

# pytest keeps its own root pytest.ini (it wins over this file); no [tool.pytest] table here on purpose.

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="format-detection" content="telephone=no" />
  <link rel="shortcut icon" href="favicon.ico">
  <title>404</title>
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
    }
    .outer_no_page {
      height: 100%;
      position: relative;
    }
    .inc-header {
      width: 100%;
      height: 0.5rem;
      position: absolute;
      top: 0;
      left: 0;
    }
    .inc-header .header-box {
      width: 100%;
      height: 0.5rem;
      background: #fff;
      margin: 0 auto;
    }
    .flex-row {
      display: flex;
      flex-direction: row;
    }
    .inc-header .logo {
      width: 2.8rem;
      height: 0.5rem;
    }
    .inc-header .logo {
      padding: 0.1rem 0.5rem;
      background: #fff;
      display: block;
    }
    .inc-header img {
      display: block;
      width: 100%;
      height: 0.34rem;
    }
    .no_page_content {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
    }
    .no_found_page {
      position: relative;
      display: block;
      width: 2.5000rem;
      height: 2.3625rem;
      top: -0.2888rem;
    }
    .no_found_page img {
      width: 100%;
      height: 100%;
    }
    *,
    :after,
    :before {
      box-sizing: border-box;
    }
    .no_data_text {
      position: absolute;
      bottom: -0.1500rem;
      left: 0.4688rem;
    }
    .no_data_text .no_data_text_one {
      font-weight: 600;
      font-size: 0.1250rem;
      color: #302c48;
      line-height: 0.1750rem;
      font-family: MicrosoftYaHei!important;
      font-style: normal;
    }
    .no_data_text .no_data_text_two {
      position: relative;
      top: 0.0875rem;
      font-weight: 500;
      font-size: 0.1000rem;
      color: #666666;
      line-height: 0.1000rem;
      font-family: MicrosoftYaHei!important;
      font-style: normal;
    }
    .return_home {
      position: relative;
      top: 0.3750rem;
      width: 0.9375rem;
      height: 0.2813rem;
      color: #fff;
      text-align: center;
      background-color: #0f45ae;
      font-size: 0.1000rem;
      font-weight: 600;
      line-height: 0.2813rem;
      border-radius: 0.0313rem;
      box-shadow: 0px 0.0813rem 0.1563rem 0px rgba(86, 123, 194, 0.17);
      cursor: pointer;
    }
@media screen and (max-width: 750px) {
	.inc-header{
		height: 0.6rem;
	}
	.inc-header .logo{
		width:100%;
		height: 0.6rem;
    padding: 0.1rem 0.1rem;
	}
	.inc-header img{
		height: 0.36rem;
		width:auto;
		margin: unset;
	}
	.no_found_page{
		left: 0.25rem;
	}
	.return_home{
		font-size: 0.14rem;
		width:1.5rem;
	}
	.no_data_text{
		left: 0.13rem;
	}
	.no_data_text .no_data_text_one{
		font-size: 0.14rem;
		text-align: center;
	}
	.no_data_text .no_data_text_two{
		font-size: 0.12rem;
		text-align: center;
	}
	
}

  </style>
</head>
<body>
  <div class="outer_no_page">
    <div class="inc-header">
      <div class="header-box flex-row">
        <div class="logo">
          <img src="/images/index_icon.jpg" alt="">
        </div>
      </div>
    </div>
    <div class="no_page_content">
      <div class="no_found_page">
        <img  src="/images/404_icon.png" alt="">
        <div class="no_data_text">
          <div class="no_data_text_one">哎呀，出错了！</div>
          <div class="no_data_text_two" >您访问的页面不存在</div>
          <div class="return_home" id="return_home">返回首页(<span id="return_min_to">10</span>s)</div>
        </div>
      </div>
    </div>
  </div>
  <script src="/images/jquery.min.js" ></script>
  <script src="/images/ydui.flexible.js" ></script>
  <script>
    $(document).ready( function() {
      var countdown = 10;
      $('#return_min_to').text(countdown);
      var counter = setInterval( function() {
        countdown--;
        $('#return_min_to').text(countdown);
        if( countdown <= 0 ) {
          clearInterval( counter );
          window.location.href="/";
        }
      }, 1000 );

      $('#return_home').click( function() {
        window.location.href="/";
      } );

    } ) 
  </script>
</body>
</html>

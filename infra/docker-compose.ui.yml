version: '3.9'

services:
  ui-api:
    build:
      context: ../services/ui-api
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=/app/data/market.duckdb
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 2

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://ui-api:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://ui-api:8000
    depends_on:
      ui-api:
        condition: service_healthy

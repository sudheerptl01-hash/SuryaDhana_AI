services:

  # ── Master Controller (IST scheduler + telemetry server on :8008) ────────────
  master-controller:
    build:
      context: ..
      dockerfile: services/master-controller/Dockerfile
    ports:
      - "8008:8008"
    environment:
      - DATA_SERVICE_URL=http://data-service:8001
      - ML_SERVICE_URL=http://ml-service:8003
      - RL_SERVICE_URL=http://rl-service:8004
      - EXECUTION_SERVICE_URL=http://execution-service:8006
      - RL_TRAINER_PATH=/app/scripts/rl_trainer.py
      - PYTHON_BIN=python
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../scripts:/app/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── UI API ────────────────────────────────────────────────────────────────────
  ui-api:
    build:
      context: ../services/ui-api
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=/app/data/market.duckdb
      - DUCKDB_PATH=/app/data/market.duckdb
      - STOCK_UNIVERSE_PATH=/app/data/NSE_1500.csv
      - DATA_SERVICE_URL=http://data-service:8001
      - FEATURE_SERVICE_URL=http://feature-service:8002
      - ML_SERVICE_URL=http://ml-service:8003
      - RL_SERVICE_URL=http://rl-service:8004
      - EXECUTION_SERVICE_URL=http://execution-service:8006
      - MASTER_CONTROLLER_URL=http://master-controller:8008
      - UI_API_ENV_FILE=/app/.env
      # shared/http_guard.py: the ui container reaches ui-api as host.docker.internal / ui-api, and container
      # peers are never loopback (the Origin check still applies)
      - GUARD_ALLOWED_HOSTS=ui-api,host.docker.internal
      - GUARD_ALLOW_REMOTE_WRITES=1
      # Override .env localhost Redis URL with Docker DNS hostname
      - REDIS_URL=redis://redis:6379/0
      # Phase 4 Glass-Box — novel alpha engine bind-mounted (not in the image)
      - ALPHA_ENGINE_PATH=/app/novel_alpha_engine.py
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
      - ../scripts:/app/scripts
      # Phase 4 — Alpha Discovery Desk: bind-mount the engine + validated contract
      # read-only so the alpha router can import the strategy registry / PARAM_SPEC
      # without baking them into the image.
      - ../novel_alpha_engine.py:/app/novel_alpha_engine.py:ro
      - ../validated_alpha.md:/app/validated_alpha.md:ro
      # Research library (RSCH): study reports + reference docs, read-only
      - ../reports:/app/reports:ro
      - ../docs:/app/docs:ro
      # Feature engine (FEATURE_COLS / DEFAULT_TRAIN_FEATURES): routers/pipeline.py resolves
      # it at <parents[2]>/feature-service = /feature-service. Without this mount ui-api
      # silently fell back to a legacy list incl. price-level features (macd, sma_*).
      - ../services/feature-service/feature_engine.py:/feature-service/feature_engine.py:ro
      # News Catalyst Terminal: daily scanner JSON (written by an external session)
      - ../new_scnner:/app/new_scnner:ro
      # Decision Desk: shared strategy/cost/panel code (routers/desk.py imports shared.*)
      - ../shared:/app/shared:ro
    depends_on:
      master-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  # ── Next.js UI ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Next.js freezes rewrites() into .next/routes-manifest.json at BUILD time,
        # so this build-arg (not the runtime `environment` override below) is what
        # actually sets the server-side /api/* proxy target. Point it at the host-
        # published ui-api port to avoid undici/Docker-DNS resets on Docker Desktop Mac.
        - NEXT_PUBLIC_API_BASE=http://host.docker.internal:8010
    ports:
      - "3000:3000"
    environment:
      # Route server-side rewrites through the host machine port to avoid
      # undici DNS failures with Docker's embedded resolver on Docker Desktop Mac.
      - NEXT_PUBLIC_API_BASE=http://host.docker.internal:8010
      # Force IPv4-first DNS resolution in undici (Next.js HTTP client)
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      ui-api:
        condition: service_healthy
    restart: unless-stopped

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DUCKDB_PATH: /data/market.duckdb
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  STOCK_UNIVERSE_PATH: /data/NSE_1500.csv
  DATA_SERVICE_URL: http://data-service:8001
  FEATURE_SERVICE_URL: http://feature-service:8002
  ML_SERVICE_URL: http://ml-service:8003
  RL_SERVICE_URL: http://rl-service:8004
  RISK_SERVICE_URL: http://risk-service:8005
  EXECUTION_SERVICE_URL: http://execution-service:8006
  MONITORING_SERVICE_URL: http://monitoring-service:8007
  MASTER_CONTROLLER_URL: http://master-controller:8008
  # shared/http_guard.py: containers call each other by service name and are never loopback peers
  GUARD_ALLOWED_HOSTS: data-service,ui-api,master-controller,host.docker.internal
  GUARD_ALLOW_REMOTE_WRITES: "1"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      data-service:
        condition: service_healthy
      feature-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      rl-service:
        condition: service_healthy
      risk-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
      master-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Data Service ────────────────────────────────────────────────────────────

  data-service:
    build:
      context: ..
      dockerfile: services/data-service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      <<: *common-env
    volumes:
      # Share the same host data dir that ui-api mounts at /app/data.
      # data-service writes to /data/market.duckdb → host: <project>/data/market.duckdb
      # ui-api reads  from /app/data/market.duckdb → same host file.
      - ../data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Feature Service ─────────────────────────────────────────────────────────

  feature-service:
    build:
      context: ..
      dockerfile: services/feature-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── ML Service ──────────────────────────────────────────────────────────────

  ml-service:
    build:
      context: ..
      dockerfile: services/ml-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      MODEL_ARTIFACT_DIR: /app/model-artifacts
    volumes:
      # Own volume, mounted OUTSIDE the `models` code package (see MODEL_ARTIFACT_DIR).
      - ml-model-artifacts:/app/model-artifacts
      - ../data:/data  # read-only DuckDB access for /batch-predict
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── RL Service ──────────────────────────────────────────────────────────────

  rl-service:
    build:
      context: ..
      dockerfile: services/rl-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
    volumes:
      - rl-model-artifacts:/app/services/rl-service/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Risk Service ────────────────────────────────────────────────────────────

  risk-service:
    build:
      context: ..
      dockerfile: services/risk-service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Execution Service ───────────────────────────────────────────────────────

  execution-service:
    build:
      context: ..
      dockerfile: services/execution-service/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - ../.env
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Monitoring Service ──────────────────────────────────────────────────────

  monitoring-service:
    build:
      context: ..
      dockerfile: services/monitoring-service/Dockerfile
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      <<: *default-healthcheck
    restart: unless-stopped

  # ── Master Controller (IST Autopilot Scheduler) ─────────────────────────────

  master-controller:
    build:
      context: ..
      dockerfile: services/master-controller/Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - ../.env
    environment:
      <<: *common-env
      RL_TRAINER_PATH: /app/scripts/rl_trainer.py
      PYTHON_BIN: python
    volumes:
      - ../data:/data
      - ../scripts:/app/scripts
    depends_on:
      data-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      rl-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  ml-model-artifacts:
  rl-model-artifacts:
